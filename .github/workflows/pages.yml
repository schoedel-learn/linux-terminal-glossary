name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate static SEO pages
        run: |
          python3 scripts/build_static_pages.py "${{ vars.GLOSSARY_SITE_URL || 'https://schoedel-learn.github.io/linux-terminal-glossary' }}"
      - name: Stage site files
        run: |
          cp index.html commands.json search_index.json search_vectors.json "${INDEXNOW_KEY}.txt" site/
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Ping IndexNow (Bing/Seznam/Yandex)
        run: |
          curl -s "https://api.indexnow.org/indexnow?url=https%3A%2F%2Flinux.schoedeldesign.ai%2Fsitemap.xml&key=${INDEXNOW_KEY}" || true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
